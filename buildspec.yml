version: 0.2

phases:
  pre_build:
    commands:
    - echo Logging in to Amazon ECR
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
    - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION}
    - SHORT_TAG=$(echo $IMAGE_TAG | cut -c 1-7)
  build:
    commands:
    - echo Building Docker image
    - docker build -t $ECR_REPOSITORY_URI:$SHORT_TAG ./app
    - docker tag $ECR_REPOSITORY_URI:$SHORT_TAG $ECR_REPOSITORY_URI:latest
  post_build:
    commands:
    - echo Pushing Docker images
    - docker push $ECR_REPOSITORY_URI:$SHORT_TAG
    - docker push $ECR_REPOSITORY_URI:latest
    - printf '[{"name":"web","imageUri":"%s"}]' "$ECR_REPOSITORY_URI:$SHORT_TAG" > imagedefinitions.json

artifacts:
  files:
  - imagedefinitions.json
